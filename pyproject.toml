[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-medical-rag"
version = "0.1.0"
description = "한국어 의료 QA를 위한 하이브리드 RAG 파이프라인 (BM25 + 벡터 검색, RRF 융합, CrossEncoder 재랭킹)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "iaynu" }]
keywords = ["rag", "korean", "bm25", "reranking", "rrf", "medical-qa"]

# 코어는 BM25만 필요합니다. 임베딩·재랭킹·생성 모델은 extras로 뺐습니다.
# 검색·융합 로직만 검증할 때 torch를 받지 않아도 되게 하려는 의도입니다.
dependencies = [
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
morph = ["kiwipiepy>=0.17"]
models = [
    "torch>=2.1",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
]
eval = ["pandas>=2.0", "bert-score>=0.3.13"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
krag = "korean_medical_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
